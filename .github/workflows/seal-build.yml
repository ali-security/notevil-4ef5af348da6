# Authored for the sealed build: upstream notevil ships no CI configuration.
# Builds the npm tarball with the toolchain the 1.3.3 release was packed with
# (Node 13.6.0 / npm 6.13.4) and runs the project's own `npm test` (tape).
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "tape test file glob to run instead of the full suite (empty = full suite)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 13.6.0
      - name: Versions
        run: |
          node --version
          npm --version
      - name: Install
        run: npm ci
      - name: Test
        run: |
          if [ -z "${{ inputs.test-filter }}" ]; then
            npm test
          else
            npx tape ${{ inputs.test-filter }}
          fi
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: notevil-tgz
          path: notevil-*.tgz
          if-no-files-found: error
